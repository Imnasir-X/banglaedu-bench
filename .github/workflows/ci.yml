name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Validate public dev split (schema + recomputed numeric keys)
        run: uv run banglaedu-bench validate dev
      - name: Tests
        # The private test split is not in the repo; tests that need it skip.
        run: uv run pytest
      - name: Harness smoke test (offline mock model, no API keys)
        run: |
          uv run banglaedu-bench run --model mock-oracle --split dev --out /tmp/results
          uv run banglaedu-bench leaderboard --results /tmp/results --split dev --out /tmp/lb

[project]
name = "banglaedu-bench"
version = "0.2.0"
description = "BanglaEdu Bench: score any model on Bangladesh NCTB questions from class 5 through college."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nasir Khan", email = "nasirkhan496088@gmail.com" }]
keywords = ["bangla", "bengali", "llm", "benchmark", "evaluation", "nctb", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Bengali",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The runtime has no third-party dependencies on purpose: the harness talks to
# OpenAI-compatible endpoints with urllib, so it runs anywhere Python runs.
dependencies = []

[project.urls]
Homepage = "https://github.com/Imnasir-X"

[project.scripts]
banglaedu-bench = "banglaedu_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banglaedu_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 flag "ambiguous" Unicode characters; Bangla text is the point of this project.
# E501: the formatter enforces line length for code; long Bangla string literals are left whole.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
